name = "disposable-temp-mail"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Copy this file to wrangler.toml and fill in your own values:
#   cp wrangler.example.toml wrangler.toml
# wrangler.toml is git-ignored — never commit your real domains/IDs.

# Set workers_dev to false when using your own domain
workers_dev = false

# ---- D1 Database ----
# Step 1: run `npx wrangler d1 create disposable-temp-mail-db`
# Step 2: paste the database_id below
[[d1_databases]]
binding = "DB"
database_name = "disposable-temp-mail-db"
database_id = ""

# ---- Custom domain route ----
# CHANGE THIS to your own subdomain (e.g. tmail.example.com)
[[routes]]
pattern = "tmail.YOURDOMAIN.com"
custom_domain = true

# ---- Scheduled cleanup (daily retention purge) ----
[triggers]
crons = ["0 3 * * *"]

# ---- R2 bucket (attachment bytes; metadata stays in D1) ----
# Create it once: `npx wrangler r2 bucket create temp-mail-attachments`
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "temp-mail-attachments"

# ---- Environment variables ----
# CHANGE THESE to your own domain
[vars]
APP_NAME = "Disposable Temp Mail"
MAIL_DOMAIN = "YOURDOMAIN.com"
WEB_HOST = "tmail.YOURDOMAIN.com"
# Address plans are per-inbox (7/30/90/keep); ledger entries auto-delete 90
# days after arrival; sessions expire after 30 days
# Abuse controls (allowed hits per hour)
RATE_LIMIT_INBOXES_PER_HOUR = "20"
RATE_LIMIT_INBOXES_PER_IP_PER_HOUR = "30"
RATE_LIMIT_SESSIONS_PER_HOUR = "10"
# Turnstile bot gate on inbox creation (Cloudflare dashboard → Turnstile).
# Leave empty to disable (local dev). Secret goes in wrangler.toml, never here:
#   npx wrangler secret put TURNSTILE_SECRET_KEY
TURNSTILE_SITE_KEY = ""

# ---- Static assets (web frontend, don't change) ----
[assets]
directory = "./src/web"

# ---- Observability ----
[observability]
enabled = true
