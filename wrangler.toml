name = "disposable-temp-mail"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Set workers_dev to false when using your own domain
workers_dev = false

# ---- D1 Database ----
# Step 1: run `npx wrangler d1 create disposable-temp-mail-db`
# Step 2: copy the database_id here
[[d1_databases]]
binding = "DB"
database_name = "disposable-temp-mail-db"
database_id = ""

# ---- Email Worker ----
[email]
action = "process"

# ---- Custom domain routes ----
# CHANGE THIS to your own domain (e.g. tmail.example.com)
[[routes]]
pattern = "tmail.YOURDOMAIN.com"
custom_domain = true

# ---- Scheduled cleanup (daily retention purge) ----
[triggers]
crons = ["0 3 * * *"]

# ---- Environment variables ----
# CHANGE THESE to your own domain
[vars]
APP_NAME = "Disposable Temp Mail"
MAIL_DOMAIN = "YOURDOMAIN.com"
WEB_HOST = "tmail.YOURDOMAIN.com"
# Data retention for messages/inboxes (days); sessions expire after 30 days
RETENTION_DAYS = "7"
# Abuse controls (allowed hits per hour)
RATE_LIMIT_INBOXES_PER_HOUR = "20"
RATE_LIMIT_SESSIONS_PER_HOUR = "10"

# ---- Static assets (web frontend) ----
[assets]
directory = "./src/web"

# ---- Observability ----
[observability]
enabled = true
