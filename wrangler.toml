name = "disposable-temp-mail"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Production on tmail.hela.my.id (custom domain only)
workers_dev = false

# ---- D1 Database ----
[[d1_databases]]
binding = "DB"
database_name = "disposable-temp-mail-db"
database_id = "7e84d13a-bfcd-46ec-9490-0581605530ce"

# ---- Custom domain route ----
[[routes]]
pattern = "tmail.hela.my.id"
custom_domain = true

# ---- Scheduled cleanup (daily retention purge) ----
[triggers]
crons = ["0 3 * * *"]

# ---- Environment variables ----
[vars]
APP_NAME = "Disposable Temp Mail"
MAIL_DOMAIN = "tmail.hela.my.id"
WEB_HOST = "tmail.hela.my.id"
# Data retention for messages/inboxes (days); sessions expire after 30 days
RETENTION_DAYS = "7"
# Abuse controls (allowed hits per hour)
RATE_LIMIT_INBOXES_PER_HOUR = "20"
RATE_LIMIT_SESSIONS_PER_HOUR = "10"

# ---- Static assets (web frontend) ----
[assets]
directory = "./src/web"

# ---- Observability ----
[observability]
enabled = true
